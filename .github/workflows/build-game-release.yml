name: Build Game Release

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: Text to show under the Release Note section.
        required: true
        default: Initial Alpha Release
        type: string

permissions:
  contents: read

concurrency:
  group: build-game-release
  cancel-in-progress: false

jobs:
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      build_time: ${{ steps.metadata.outputs.build_time }}
      repo_files_sha256: ${{ steps.metadata.outputs.repo_files_sha256 }}
      release_hash_suffix: ${{ steps.metadata.outputs.release_hash_suffix }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      godot_editor_version: ${{ steps.metadata.outputs.godot_editor_version }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$PRIVATE_REPOS_READ_TOKEN" ]; then
            echo "::error::PRIVATE_REPOS_READ_TOKEN is required to check out game.godot."
            exit 1
          fi

          if [ -z "$GAME_BUILDS_RELEASE_TOKEN" ]; then
            echo "::error::GAME_BUILDS_RELEASE_TOKEN is required to read and publish game-builds releases."
            exit 1
          fi

        env:
          PRIVATE_REPOS_READ_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
          GAME_BUILDS_RELEASE_TOKEN: ${{ secrets.GAME_BUILDS_RELEASE_TOKEN }}

      - name: Check out workflows repo
        uses: actions/checkout@v4

      - name: Check out game.godot
        uses: actions/checkout@v4
        with:
          repository: Lunavale-Collective/game.godot
          ref: main
          path: game.godot
          token: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Read Godot release metadata and enforce version gate
        id: metadata
        run: |
          python3 scripts/game_release_metadata.py \
            --repo-root game.godot \
            --project-root game.godot \
            --release-repo Lunavale-Collective/game-builds
        env:
          GAME_BUILDS_RELEASE_TOKEN: ${{ secrets.GAME_BUILDS_RELEASE_TOKEN }}

  build:
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_os: windows
            asset_arch: x64
            runner: ubuntu-24.04
            preset: CI Windows
            package_ext: zip
            output_name: Lunavale.exe
          - asset_os: macos
            asset_arch: universal
            runner: macos-14
            preset: CI macOS
            package_ext: zip
            output_name: Lunavale.app
          - asset_os: linux
            asset_arch: x64
            runner: ubuntu-24.04
            preset: CI Linux
            package_ext: tar.gz
            output_name: Lunavale.x86_64

    steps:
      - name: Check out workflows repo
        uses: actions/checkout@v4

      - name: Check out game.godot
        uses: actions/checkout@v4
        with:
          repository: Lunavale-Collective/game.godot
          ref: ${{ needs.version-gate.outputs.source_sha }}
          path: game.godot
          token: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned source and toolchain
        env:
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
          REPO_HASH: ${{ needs.version-gate.outputs.repo_files_sha256 }}
          GODOT_VERSION: ${{ needs.version-gate.outputs.godot_editor_version }}
        run: |
          test "$(git -C game.godot rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GODOT_VERSION" = '4.7.2'
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"scripts"); from game_release_metadata import repo_files_hash; import os; assert repo_files_hash(Path("game.godot")) == os.environ["REPO_HASH"]'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install checksum-pinned Godot .NET editor and matching templates
        env:
          HOST_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 scripts/install_godot.py --host "$HOST_OS" --destination "$RUNNER_TEMP/godot"

      - name: Prepare desktop release presets
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: python3 scripts/godot_release.py --project game.godot --version "$VERSION"

      - name: Import and export Godot C# player
        timeout-minutes: 60
        env:
          PRESET: ${{ matrix.preset }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          OUTPUT_NAME: ${{ matrix.output_name }}
        run: |
          set -euo pipefail
          build_root="$GITHUB_WORKSPACE/builds/${ASSET_OS}_${ASSET_ARCH}"
          mkdir -p "$build_root"
          dotnet build game.godot/Lunavale.csproj -c Debug
          "$GODOT" --headless --path game.godot --import
          "$GODOT" --headless --path game.godot --export-release "$PRESET" "$build_root/$OUTPUT_NAME"
          python3 scripts/verify_godot_build.py "$build_root" "$ASSET_OS"

      - name: Smoke Linux managed player startup
        if: matrix.asset_os == 'linux'
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_godot_build.py builds/linux_x64/Lunavale.x86_64

      - name: Smoke macOS managed player startup
        if: matrix.asset_os == 'macos'
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_godot_build.py builds/macos_universal/Lunavale.app/Contents/MacOS/Lunavale

      - name: Package build
        id: package
        run: |
          set -euo pipefail
          asset_name="${ASSET_OS}_${ASSET_ARCH}_${VERSION}_${BUILD_DATE}_${BUILD_TIME}_${REPO_HASH}.${PACKAGE_EXT}"
          build_root="builds/${ASSET_OS}_${ASSET_ARCH}"
          package_root="$RUNNER_TEMP/lunavale-package/${ASSET_OS}_${ASSET_ARCH}"
          package_path="$RUNNER_TEMP/${asset_name}"

          if [ ! -d "$build_root" ]; then
            echo "::error::Godot build output directory not found: $build_root"
            exit 1
          fi

          mkdir -p "$package_root"
          cp -R "$build_root"/. "$package_root"/

          if [ "$PACKAGE_EXT" = "zip" ]; then
            (cd "$package_root" && zip -qry "$package_path" .)
          elif [ "$PACKAGE_EXT" = "tar.gz" ]; then
            tar -C "$package_root" -czf "$package_path" .
          else
            echo "::error::Unsupported package extension: $PACKAGE_EXT"
            exit 1
          fi

          echo "path=$package_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
        env:
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          PACKAGE_EXT: ${{ matrix.package_ext }}
          VERSION: ${{ needs.version-gate.outputs.version }}
          BUILD_DATE: ${{ needs.version-gate.outputs.build_date }}
          BUILD_TIME: ${{ needs.version-gate.outputs.build_time }}
          REPO_HASH: ${{ needs.version-gate.outputs.repo_files_sha256 }}

      - name: Upload packaged build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - version-gate
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create asset checksums
        run: |
          cd release-assets
          sha256sum -- ./*.zip ./*.tar.gz > SHA256SUMS.txt

      - name: Write release notes
        run: |
          set -euo pipefail

          release_note="${RELEASE_NOTE_TEXT//$'\r'/}"
          if [ -z "${release_note//[[:space:]]/}" ]; then
            echo "::error::Release note text cannot be empty."
            exit 1
          fi

          cat > release-notes.md <<EOF
          # ⚠️ Confidential Access Warning

          **Authorized testers and appointed ExoHayvan LLC members only.**

          Stop before you open, download, copy, share, stream, archive, reverse engineer, discuss, disclose, or distribute anything in this release. If you are not an approved Lunavale tester under NDA or an appointed ExoHayvan LLC member using these materials for approved company work, leave immediately and notify the Lunavale team that you reached this page.

          Access is logged. Unauthorized access, use, or disclosure may result in access revocation, evidence preservation, civil claims, damages, injunctive relief, and referral to the appropriate authorities where applicable. These builds and all related materials are confidential property of ExoHayvan LLC.

          ---

          **Release Note:**

          EOF

          printf '%s\n\n' "$release_note" >> release-notes.md

          cat >> release-notes.md <<EOF
          ---
          <sup>Lunavale game build ${VERSION}</sup>

          <sup>Source repository: Lunavale-Collective/game.godot</sup><br>
          <sup>Source commit: ${SOURCE_SHA}</sup><br>
          <sup>Godot .NET editor version: ${GODOT_EDITOR_VERSION}</sup><br>
          <sup>Godot project version: ${VERSION}</sup><br>
          <sup>Build timestamp UTC: ${BUILD_DATE} ${BUILD_TIME}</sup><br>
          <sup>Repo files SHA-256: ${REPO_HASH}</sup><br>
          <sup>Release hash suffix: ${RELEASE_HASH_SUFFIX}</sup>

          <sup>Platforms:</sup><br>
          <sup>windows_x64</sup><br>
          <sup>macos_universal</sup><br>
          <sup>linux_x64</sup>
          EOF
        env:
          RELEASE_NOTE_TEXT: ${{ inputs.release_note }}
          VERSION: ${{ needs.version-gate.outputs.version }}
          SOURCE_SHA: ${{ needs.version-gate.outputs.source_sha }}
          GODOT_EDITOR_VERSION: ${{ needs.version-gate.outputs.godot_editor_version }}
          BUILD_DATE: ${{ needs.version-gate.outputs.build_date }}
          BUILD_TIME: ${{ needs.version-gate.outputs.build_time }}
          REPO_HASH: ${{ needs.version-gate.outputs.repo_files_sha256 }}
          RELEASE_HASH_SUFFIX: ${{ needs.version-gate.outputs.release_hash_suffix }}

      - name: Create draft release and upload assets
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "$IS_PRERELEASE" = "true" ] || [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)(\.|-|$) ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo Lunavale-Collective/game-builds \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --draft \
            $prerelease_flag

          gh release edit "$RELEASE_TAG" \
            --repo Lunavale-Collective/game-builds \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GAME_BUILDS_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.version-gate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.version-gate.outputs.release_title }}
          IS_PRERELEASE: ${{ needs.version-gate.outputs.is_prerelease }}
